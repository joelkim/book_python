project:
  type: website
  render:
    - "*.ipynb"

format:
  html:
    toc: true
    toc-depth: 5
    css: styles.css
    page-layout: full
    code-block-bg: true
    code-overflow: wrap
    code-line-numbers: false
    monofont: D2Coding
    language:
      crossref-tbl-title: "표"
    mermaid:
      theme: neutral
    include-in-header:
      text: |
        <script type="text/javascript">
        // !로 시작하는 파이썬 코드에서 ! 삭제
        document.addEventListener('DOMContentLoaded', () => {
          const allOps = document.querySelectorAll(
            'div.cell div.sourceCode.cell-code pre.sourceCode.python code span.op:first-of-type'
          );
          allOps.forEach(el => {
            if (el.innerHTML === '!') {
              el.innerHTML = '';
              const dollarSpan = document.createElement('span');
              dollarSpan.classList.add('bash_prompt');
              el.parentNode.parentNode.insertBefore(dollarSpan, el.parentNode);
            }
          });
          // || true 로 끝나는 bash 코드에서 || true 삭제
          const allOrTrue = document.querySelectorAll(
            'div.cell div.sourceCode.cell-code pre.sourceCode.bash code span:last-of-type'
          );
          allOrTrue.forEach(span => {
            let text = span.textContent;
            if (text.endsWith('|| true')) {
              span.textContent = text.slice(0, -8);
            }
          });
        });
        </script>

bibliography: references.bib
reference-location: margin

website:
  title: "Python Book"
  site-url: https://pythonbook.madebykim.kr/
  sidebar:
    style: "docked"
    search: true
    contents:
      - "index.ipynb"
      - section: "개발환경"
        contents:
        - "devenv/pip.ipynb"
      - section: "파이썬 언어 기초"
        contents:
        - "lang/basic.ipynb"
      - section: "프로젝트"
        contents:
        - "project/pyproject.ipynb"
        - "project/poetry.ipynb"
        - "project/uv.ipynb"
      - section: "애플리케이션"
        contents:
        - section: "데이터"
          contents:
          - "apps/data/pydantic/pydantic.ipynb"
        - section: "웹"
          contents:
          - "apps/web/uvicorn/uvicorn.ipynb"
          - "apps/web/starlette/starlette.ipynb"
          - "apps/web/fastapi/fastapi.ipynb"
