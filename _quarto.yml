project:
  type: website
  render:
    - "*.ipynb"

format:
  html:
    toc: true
    toc-depth: 5
    css: styles.css
    page-layout: full
    code-block-bg: true
    code-overflow: wrap
    code-line-numbers: false
    monofont: D2Coding
    language:
      crossref-tbl-title: "표"
    mermaid:
      theme: neutral
    filters:
      - clean-code.lua
bibliography: references.bib
reference-location: margin

website:
  title: "Python Book"
  site-url: https://pythonbook.madebykim.kr/
  sidebar:
    style: "docked"
    search: true
    contents:
      - "index.ipynb"
      - section: "개발환경"
        contents:
        - "devenv/pip.ipynb"
      - section: "파이썬 언어"
        contents:
        - "lang/basic.ipynb"
        - "lang/async.ipynb"
      - section: "프로젝트"
        contents:
        - "project/pyproject.ipynb"
        - "project/poetry.ipynb"
        - "project/uv.ipynb"
      - section: "애플리케이션"
        contents:
        - section: "데이터"
          contents:
          - "apps/data/pydantic/pydantic.ipynb"
        - section: "웹"
          contents:
          - "apps/web/uvicorn/uvicorn.ipynb"
          - "apps/web/starlette/starlette.ipynb"
          - "apps/web/fastapi/fastapi.ipynb"
